name: Validate Rock-on

on:
  workflow_dispatch:
  push:
    paths:
      - 'openvpn-access-server.json'
      - '.github/workflows/validate-rockon.yml'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show files
        run: |
          pwd
          ls -la
          ls -l openvpn-access-server.json

      - name: Validate OpenVPN Access Server Rock-on
        run: |
          docker run --rm \
            -v "$PWD:/files" \
            ghcr.io/rockstor/rockon-validator:main \
            --diff openvpn-access-server.json
